name: Cloudflare（サーバー）

# 共同経営サーバー（apps/server）を Cloudflare Workers にデプロイする。
# 事前に リポジトリの Settings → Secrets and variables → Actions に次の2つを登録してください（docs/CLOUDFLARE_SETUP.md）:
#   CLOUDFLARE_API_TOKEN  … Cloudflare の API トークン（Workers の編集 ＋ D1 の編集）
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
# 未登録のあいだはデプロイをスキップする（実行結果に案内を表示）。
# D1 の作成・ID の設定・SESSION_SECRET の登録もここで行う（apps/server/scripts/cloudflare.mjs）。
on:
  push:
    branches: [SecondAKIRA]
    paths:
      - apps/server/**
      - packages/core/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-server.yml
  workflow_dispatch:
    inputs:
      smoke:
        description: デプロイ後に共同経営の通し確認（ルーム作成・参加・操作・保存）も行う
        type: boolean
        default: false

permissions:
  contents: read

# デプロイの途中で止めない（後から来た実行は待たせる）
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.keys.outputs.enabled }}
    steps:
      - name: Cloudflare の鍵が登録されているか確認
        id: keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare の鍵が未登録です::Settings → Secrets and variables → Actions に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録すると、サーバーをデプロイします（docs/CLOUDFLARE_SETUP.md）"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.url }}
    # 鍵は使うステップ（準備・デプロイ）にだけ渡す（npm ci やテストには渡さない）
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェックとテスト（サーバー）
        run: |
          npm run typecheck -w @jiro/core -w @jiro/server
          npm test -w @jiro/server
      - name: 準備（D1 の用意・ID の設定・SESSION_SECRET の確認）
        id: prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/server/scripts/cloudflare.mjs prepare
      - name: デプロイ
        id: deploy
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRETS_FILE: ${{ steps.prepare.outputs.secrets_file }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          if [ -n "$SECRETS_FILE" ]; then
            npx wrangler deploy --secrets-file "$SECRETS_FILE"
          else
            npx wrangler deploy
          fi
          url=$(node -e '
            const lines = require("fs").readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").trim().split("\n");
            const d = lines.map((l) => JSON.parse(l)).find((e) => e.type === "deploy");
            console.log((d?.targets ?? []).find((t) => t.endsWith(".workers.dev")) ?? "");
          ')
          if [ -z "$url" ]; then
            echo "::error::デプロイ先の workers.dev の URL が見つかりません"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: 秘密鍵のファイルを消す
        if: always() && steps.prepare.outputs.secrets_file != ''
        env:
          SECRETS_FILE: ${{ steps.prepare.outputs.secrets_file }}
        run: rm -f "$SECRETS_FILE"
      - name: 動作確認（バージョン）
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # 初回は workers.dev の反映に数分かかることがある
          for i in $(seq 1 30); do
            if body=$(curl -fsS "$URL/api/v1/game-version"); then
              echo "$body"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/api/v1/game-version が応答しません"
          exit 1
      - name: 動作確認（共同経営の通し）
        if: inputs.smoke
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: node apps/server/scripts/smoke.mjs "$URL"
      - name: 結果のまとめ
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### 共同経営サーバーをデプロイしました"
            echo ""
            echo "- URL: $URL"
            echo "- ブラウザ版（GitHub Pages）は、この URL を自動で使います（リポジトリの Variables に VITE_SERVER_URL があればそちらを優先）"
          } >> "$GITHUB_STEP_SUMMARY"
