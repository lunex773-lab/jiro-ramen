name: GitHub Pages

# クライアント（ブラウザ版）を GitHub Pages に公開する。
# 事前に リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にしてください。
# Pages が無効のあいだはビルドだけ行い、公開はスキップする（実行結果に案内を表示）
on:
  push:
    branches: [SecondAKIRA]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: GitHub Pages が有効か確認
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 公開元が「GitHub Actions」（build_type=workflow）のときだけ公開する
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages の公開元が GitHub Actions ではありません::Settings → Pages → Build and deployment → Source を「GitHub Actions」にすると、次の push から公開されます"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 共同経営サーバーの URL を決める
        id: server
        env:
          # リポジトリの Variables に VITE_SERVER_URL があればそれを使う。
          # なければ Cloudflare の鍵（Secrets）から https://<Worker 名>.<サブドメイン>.workers.dev を求める（.github/workflows/deploy-server.yml と同じ鍵）
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/server/scripts/cloudflare.mjs url
      - name: ビルド
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ steps.server.outputs.url }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: apps/client/dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
